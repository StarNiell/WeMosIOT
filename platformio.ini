; WeMosIOT - IOT eXperience device firmware
; PlatformIO project configuration: https://docs.platformio.org/page/projectconf.html
;
; One source tree, one environment per board family:
;   pio run -e d1_mini                 build for WeMos D1 / D1 mini (ESP8266)
;   pio run -e d1_mini -t upload       flash the firmware
;   pio run -e d1_mini -t uploadfs     flash the LittleFS image built from data/
;                                      (WARNING: replaces the device configuration
;                                      with the template; not needed for updates)
;
; The configuration page (web/index.html) is embedded in the firmware by
; tools/embed_web.py before every build: flashing the firmware updates it.
;
; Compile-time options from src/defaults.h can be overridden per environment
; with build_flags (no spaces around "=", text values quoted with \"):
;   build_flags =
;       -DCFG_SWITCH_ENABLED=1        ; on/off output            (default 1)
;       -DCFG_BUTTON_ENABLED=1        ; pulse on the output      (default 1)
;       -DCFG_SENSOR_ENABLED=0        ; DHT temperature/humidity (default 0)
;       -DCFG_FAKE_SENSOR=0           ; random sensor values     (default 0)
;       -DCFG_CONTACT_ENABLED=0       ; contact input            (default 0)
;       -DPIN_OUTPUT=4                ; see README for every pin option
;       -DDEFAULT_WEB_PWD=\"iotxadmin\" ; first password of the web page
; The full list is in README.md, section "Build options".

[platformio]
default_envs = d1_mini

[env]
framework = arduino
extra_scripts = pre:tools/embed_web.py
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3
    knolleary/PubSubClient @ ^2.8
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19

; ---------------------------------------------------------------------------
; WeMos D1 / D1 mini - ESP8266, 4 MB flash (devices currently in service)
; ---------------------------------------------------------------------------
[env:d1_mini]
platform = espressif8266
board = d1_mini
; Same layout as the Arduino IDE default for this board: FS 2 MB, OTA ~1 MB.
; Keeping it unchanged preserves the configuration stored on existing devices.
board_build.ldscript = eagle.flash.4m2m.ld
monitor_filters = esp8266_exception_decoder
build_flags =
    -DCFG_SENSOR_ENABLED=1
    -DCFG_SWITCH_ENABLED=1
    -DCFG_BUTTON_ENABLED=1
    -DCFG_CONTACT_ENABLED=1
    -DCFG_FAKE_SENSOR=1

; ---------------------------------------------------------------------------
; ESP32 C series - EXPERIMENTAL, generic profile (see src/defaults.h for pins)
; Arduino core 3.x through the pioarduino platform.
; ---------------------------------------------------------------------------
[esp32c_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

[env:esp32c3]
extends = esp32c_common
board = esp32-c3-devkitm-1
; Boards without a USB-UART chip (e.g. C3 "SuperMini") need the serial on native USB
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6]
extends = esp32c_common
board = esp32-c6-devkitc-1
