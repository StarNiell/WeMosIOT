<!DOCTYPE html>
<html lang="en"></html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <script type="text/javascript" src="js/jquery-3.5.1.min.js"></script>
    <script type="text/javascript" src="./js/index.js"></script>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/custom-style.css" />
    <title>Configuration - iotx</title>
  </head>
  <body>
	<center>
    <h1>IOT eXperience</h1>
    <h3>
      Configuration panel
    </h3>
	<p>&nbsp;</p>
	<p>
	<form name="frmConfig" action="/saveconfig" method="post">
	  <table class="table-layout">
		<tr><td class="td-title" colspan="2">WiFi</td></tr>
		<tr><td class="td-1">SSID</td><td class="td-2"><input type="text" name="wifi_ssid" value="<YOUR WIFI SID>" /></td></tr>
		<tr><td>Password</td><td><input type="text" name="wifi_pwd" value="<YOUR WIFI KEYPASS" /></td></tr>
		<tr class="tr-space"><td colspan="2"></td></tr>
		<tr><td class="td-title" colspan="2">MQTT</td></tr>
		<tr><td>Server</td><td><input type="text" name="mqtt_server" value="broker.emqx.io" /></td></tr>
		<tr><td>Port</td><td><input type="text" name="mqtt_port" value="1883" /></td></tr>
		<tr><td>Username</td><td><input type="text" name="mqtt_user" value="<YOUR MQTT USER>" /></td></tr>
		<tr><td>Password</td><td><input type="text" name="mqtt_pwd" value="<YOUR MQTT PASS>" /></td></tr>
		<tr class="tr-space"><td colspan="2"></td></tr>
		<tr><td class="td-title" colspan="2">Topics</td></tr>
		<tr><td>Subscription</td><td><input type="text" name="topic_sub" value="iotx/out" /></td></tr>
		<tr><td>Publish</td><td><input type="text" name="topic_pub" value="iotx/in" /></td></tr>
		<tr class="tr-space"><td colspan="2"></td></tr>
	  </table>
	  <table class="table-layout">
		<tr>
			<td class="td-lx"><input class="button-style-on" type="submit" value="Save" /></td>
			<td class="td-cx">&nbsp;</td>
			<td class="td-lx"><a href="javascript:history.back()"><input class="button-style-off" type="button" value="Back" /></a></td>
		</tr>
	  </table>
	</form>
	</p>
    <p>
      IOT eXperience v.1.0
    </p>
   </center>
  </body>
</html>
